services:
  postgres:
    image: postgres:16.15
    container_name: poke-trade-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poke_trade}
      POSTGRES_USER: ${POSTGRES_USER:-poke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poke}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
